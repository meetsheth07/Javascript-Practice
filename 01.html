<!-- create some HTML elements for DOM practice -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
    <style>
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .item {
            padding: 10px;
            margin: 5px 0;
            background-color: #c0c0c0;
        }
        .item-next{
            background-color: #e92f2f;
        }
        .highlight {
            background-color: yellow;
        }
    </style>
    <script src="script1.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 id="Heading">DOM Practice</h1>
        <ul id="itemList" style="list-style-type: none; padding: 0;">
            <li class="item">Item 1</li>
            <li class="item">Item 2</li>
            <li class="item">Item 3</li>
        </ul>
        <button id="highlightBtn">Highlight Items</button>
    </div>
</body> 
</html>
