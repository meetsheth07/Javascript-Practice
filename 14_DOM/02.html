<!-- create some HTML elements for DOM practice should include  a list (<ul>) from which there would be three buttons one for toggling class of listitems and one for adding items to list and third for removing items from list selected by user,next thing to include is a form for adding new items to the list,next thing we need is to change the background color of the selected item -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
    <style>
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .item {
            padding: 10px;
            margin: 5px 0;
            background-color: #c0c0c0;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .item:hover {
            background-color: #b0b0b0;
        }
        .item-next {
            background-color: #e92f2f;
            color: white;
        }
        .highlight {
            background-color: yellow;
            color: black;
            font-weight: bold;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }
        .form {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background-color: #d0d0d0;
            border-radius: 5px;
        }
        button {
            padding: 8px 15px;
            margin: 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #45a049;
        }
        input[type="text"] {
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        h1, h2 {
            cursor: pointer;
        }
    </style>
    <script src="script2.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 id="Heading">DOM Practice</h1>
        <ul id="itemList" style="list-style-type: none; padding: 0;">
            <li class="item">Item 1</li>
            <li class="item">Item 2</li>
            <li class="item">Item 3</li>
        </ul>
        <button id="toggleClassBtn">Toggle Class</button>
        <button id="addItemBtn">Add Item</button>
        
        <input type="text" id="itemToAdd" placeholder="Enter item to add">
        <button id="removeItemBtn">Remove Item</button>
        
    </div>
    <div class="form">
        <h2>Add New Item</h2>
        <form id="addItemForm">
            <input type="text" id="newItemInput" placeholder="Enter new item" required>
            <button type="submit">Add</button>
            <ul id="itemList_2" style="list-style-type: none; padding: 0;">
                 
            </ul>
        </form>
    </div>
</body> 
</html>
